version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: pathdrift_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pathdrift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pathdrift}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pathdrift}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pathdrift_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pathdrift_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pathdrift}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pathdrift}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-pathdrift}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pathdrift}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      UPLOAD_DIR: /app/uploads
      REPORT_DIR: /app/reports
      MAX_UPLOAD_SIZE_MB: 500
      ENVIRONMENT: production
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports
      - ./backend/logs:/app/logs
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pathdrift_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 -Q analysis,ml,default
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pathdrift}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pathdrift}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-pathdrift}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pathdrift}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      UPLOAD_DIR: /app/uploads
      REPORT_DIR: /app/reports
      C_FORCE_ROOT: "true"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports
      - ./backend/logs:/app/logs

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pathdrift_flower
    restart: unless-stopped
    command: celery -A app.tasks.celery_app flower --port=5555
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "5555:5555"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: pathdrift_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
